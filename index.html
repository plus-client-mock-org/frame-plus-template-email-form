<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frame+ Email Form</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #102a43;
      --muted: #486581;
      --accent: #0b7285;
      --accent-hover: #095c6a;
      --border: #d9e2ec;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #e6f4f1 0%, var(--bg) 45%);
      display: grid;
      place-items: center;
      color: var(--text);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(16, 42, 67, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="email"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(11, 114, 133, 0.15);
    }

    button {
      margin-top: 14px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Join with your email</h1>
    <p>Enter your email address and click submit.</p>

    <form id="email-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required>
      <button type="submit">Submit</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("email-form");

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      alert("Submit clicked");
    });
  </script>
</body>
</html>
