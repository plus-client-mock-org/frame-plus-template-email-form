<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frame+ Email Form</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #102a43;
      --muted: #486581;
      --accent: #0b7285;
      --accent-hover: #095c6a;
      --border: #d9e2ec;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #e6f4f1 0%, var(--bg) 45%);
      display: grid;
      place-items: center;
      color: var(--text);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(16, 42, 67, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="email"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(11, 114, 133, 0.15);
    }

    button {
      margin-top: 14px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.75;
    }

    .status {
      margin-top: 12px;
      min-height: 1.25em;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .status[data-variant="success"] {
      color: #0f7a43;
    }

    .status[data-variant="error"] {
      color: #b42318;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Join with your email</h1>
    <p>Enter your email address and click submit.</p>

    <form id="email-form" method="post" action="/">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required>
      <button type="submit">Submit</button>
    </form>

    <div id="status" class="status" aria-live="polite"></div>
  </main>

  <script>
    const form = document.getElementById("email-form");
    const statusEl = document.getElementById("status");
    const submitButton = form.querySelector('button[type="submit"]');
    const emailInput = document.getElementById("email");

    function getFrameToken() {
      const parts = window.location.pathname.split("/").filter(Boolean);
      const frameIndex = parts.indexOf("frame+");

      if (frameIndex !== -1 && parts[frameIndex + 1]) {
        return parts[frameIndex + 1];
      }

      return "";
    }

    function setStatus(message, variant) {
      statusEl.textContent = message;
      if (variant) {
        statusEl.dataset.variant = variant;
      } else {
        delete statusEl.dataset.variant;
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      if (!email) {
        setStatus("Please enter an email address.", "error");
        emailInput.focus();
        return;
      }

      submitButton.disabled = true;
      setStatus("Submitting...");

      const headers = {
        "Content-Type": "application/json"
      };

      const token = getFrameToken();
      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }

      try {
        const response = await fetch(new URL("/frame+/submit", window.location.origin), {
          method: "POST",
          headers,
          body: JSON.stringify({
            payload: {
              email
            }
          })
        });

        if (!response.ok) {
          throw new Error(`Submit failed with status ${response.status}`);
        }

        setStatus("Submitted successfully.", "success");
        form.reset();
      } catch (error) {
        setStatus("Could not submit the form. Please try again.", "error");
        console.error(error);
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
